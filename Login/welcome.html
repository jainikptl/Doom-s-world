<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome - DoomBoard</title>
  <link href="https://fonts.googleapis.com/css2?family=Bruno+Ace+SC&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Orbitron', monospace;
      background: linear-gradient(135deg, #9a343b 10%, #631e29 45%, #000000 67%, #161a25 87%);
      color: #f5434f;
      overflow: hidden;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Subtle Grid Background */
    .cyber-grid {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(245, 67, 79, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(245, 67, 79, 0.08) 1px, transparent 1px);
      background-size: 60px 60px;
      animation: gridMove 25s linear infinite;
      z-index: 1;
    }

    @keyframes gridMove {
      0% { transform: translate(0, 0); }
      100% { transform: translate(60px, 60px); }
    }

    /* Professional Container */
    .welcome-container {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 3rem 2.5rem;
      background: 
        linear-gradient(145deg, rgba(26, 26, 26, 0.4), rgba(15, 20, 25, 0.6));
      border: 1px solid rgba(245, 67, 79, 0.3);
      border-radius: 16px;
      backdrop-filter: blur(15px);
      box-shadow: 
        0 8px 32px rgba(245, 67, 79, 0.15),
        inset 0 1px 0 rgba(255, 107, 119, 0.1);
      max-width: 600px;
      width: 90%;
      animation: containerFadeIn 1.5s ease-out;
    }

    @keyframes containerFadeIn {
      0% {
        opacity: 0;
        transform: translateY(30px) scale(0.95);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Clean Welcome Text */
    .welcome-text {
      font-size: 3.5rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 1.5rem;
      color: #f5434f;
      text-shadow: 
        0 0 20px rgba(245, 67, 79, 0.6),
        0 2px 4px rgba(245, 67, 79, 0.3);
      line-height: 1.1;
    }

    .word {
      display: inline-block;
      margin-right: 0.25em;
      opacity: 0;
      transform: translateY(20px);
      animation: wordSlideIn 0.6s ease-out forwards;
    }

    @keyframes wordSlideIn {
      0% {
        opacity: 0;
        transform: translateY(20px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Professional Subtitle */
    .subtitle {
      font-size: 1.4rem;
      color: #ff8a95;
      font-weight: 300;
      letter-spacing: 0.05em;
      opacity: 0;
      animation: fadeInUp 1s ease-out 0.8s forwards;
      margin-bottom: 2.5rem;
    }

    @keyframes fadeInUp {
      0% {
        opacity: 0;
        transform: translateY(15px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Modern Progress Bar */
    .loading-section {
      opacity: 0;
      animation: fadeInUp 1s ease-out 1.2s forwards;
    }

    .loading-bar {
      width: 100%;
      max-width: 400px;
      height: 6px;
      background: rgba(245, 67, 79, 0.15);
      margin: 1.5rem auto;
      border-radius: 3px;
      overflow: hidden;
      position: relative;
    }

    .loading-progress {
      height: 100%;
      background: linear-gradient(90deg, #f5434f, #ff6b77);
      width: 0%;
      animation: loadProgress 2.5s ease-out 1.5s forwards;
      border-radius: 3px;
      position: relative;
    }

    .loading-progress::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      animation: shimmer 1.5s ease-in-out infinite;
    }

    @keyframes loadProgress {
      0% { width: 0%; }
      100% { width: 100%; }
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .loading-text {
      font-size: 0.9rem;
      color: #ff8a95;
      margin-top: 1rem;
      font-weight: 300;
      letter-spacing: 0.05em;
    }

    .loading-dots {
      display: inline-block;
    }

    .loading-dots::after {
      content: '';
      animation: dots 1.5s infinite;
    }

    @keyframes dots {
      0%, 20% { content: ''; }
      40% { content: '.'; }
      60% { content: '..'; }
      80%, 100% { content: '...'; }
    }

    /* Subtle Floating Particles */
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    .particle {
      position: absolute;
      width: 2px;
      height: 2px;
      background: rgba(245, 67, 79, 0.4);
      border-radius: 50%;
      animation: particleFloat 8s infinite ease-in-out;
    }

    @keyframes particleFloat {
      0%, 100% { 
        transform: translateY(0px);
        opacity: 0.4;
      }
      50% { 
        transform: translateY(-30px);
        opacity: 0.8;
      }
    }

    /* Status Indicator */
    .status-indicator {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 1.5rem;
      opacity: 0;
      animation: fadeInUp 1s ease-out 2s forwards;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #f5434f;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { 
        opacity: 1;
        transform: scale(1);
      }
      50% { 
        opacity: 0.6;
        transform: scale(1.2);
      }
    }

    .status-text {
      font-size: 0.85rem;
      color: #ff8a95;
      font-weight: 400;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .welcome-text {
        font-size: 2.5rem;
      }
      
      .subtitle {
        font-size: 1.2rem;
      }
      
      .welcome-container {
        padding: 2rem 1.5rem;
        margin: 1rem;
      }
      
      .loading-bar {
        max-width: 300px;
      }
    }

    @media (max-width: 480px) {
      .welcome-text {
        font-size: 2rem;
      }
      
      .subtitle {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="cyber-grid"></div>
  <div class="particles" id="particles"></div>
  
  <div class="welcome-container">
    <div class="welcome-text" id="welcome-text"></div>
    <div class="subtitle">Initializing Digital Kingdom</div>
    
    <div class="loading-section">
      <div class="loading-bar">
        <div class="loading-progress"></div>
      </div>
      <div class="loading-text">
        Loading your dashboard<span class="loading-dots"></span>
      </div>
      
      <div class="status-indicator">
        <div class="status-dot"></div>
        <span class="status-text">System Ready</span>
      </div>
    </div>
  </div>

  <script>
    // Get user info from URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const userType = urlParams.get('type') || 'candidate';
    const userName = urlParams.get('name') || 'User';

    // Generate welcome text
    function getWelcomeText() {
      if (userType === 'doom') {
        return `Welcome, Dr. ${userName}`;
      } else {
        return `Welcome, ${userName}`;
      }
    }

    // Create animated text
    function createAnimatedText() {
      const welcomeText = getWelcomeText();
      const words = welcomeText.split(' ');
      const container = document.getElementById('welcome-text');
      
      words.forEach((word, index) => {
        const span = document.createElement('span');
        span.className = 'word';
        span.textContent = word;
        span.style.animationDelay = `${index * 0.15}s`;
        container.appendChild(span);
      });
    }

    // Create subtle particles
    function createParticles() {
      const container = document.getElementById('particles');
      const particleCount = 20;
      
      for (let i = 0; i < particleCount; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.top = Math.random() * 100 + '%';
        particle.style.animationDelay = Math.random() * 8 + 's';
        particle.style.animationDuration = (Math.random() * 4 + 6) + 's';
        container.appendChild(particle);
      }
    }

    // Redirect to dashboard
    function redirectToDashboard() {
      console.log('Redirecting to dashboard...');
      
      if (userType === 'doom') {
        window.location.href = '../doomDashboard/doom_dashboard.html';
      } else {
        window.location.href = '../candidateDashboard/candidate_dashboard.html';
      }
    }

    // Initialize everything
    document.addEventListener('DOMContentLoaded', function() {
      createAnimatedText();
      createParticles();
      
      // Redirect after 5 seconds
      setTimeout(redirectToDashboard, 5000);
    });

    // Debug info
    console.log('User Type:', userType);
    console.log('User Name:', userName);
    console.log('Welcome Text:', getWelcomeText());
  </script>
</body>
</html>
