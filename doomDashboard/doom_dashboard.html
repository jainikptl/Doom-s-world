<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Admin Dashboard</title>
    <link rel="stylesheet" href="doom_dashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Animated Background -->
    <div class="animated-bg">
        <div class="floating-shapes">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
            <div class="shape shape-3"></div>
            <div class="shape shape-4"></div>
            <div class="shape shape-5"></div>
        </div>
    </div>

    <div class="container">
        <!-- Enhanced Sidebar -->
        <div class="sidebar">
            <div class="logo">
                <div class="logo-icon">
                    <img src="../assets/pngegg.png" alt="Project Logo" height="40" />  
                </div>
                <h1>Dr. Doom Dashboard</h1>
            </div>
            
            <nav class="nav-menu">
                <div class="nav-item active" data-section="dashboard">
                    <span class="nav-icon">📊</span>
                    <span class="nav-text">Dashboard</span>
                    <div class="nav-indicator"></div>
                </div>
                <div onclick="window.location.href='../doomDashboard/Sections/candidates/candidates.html'" class="nav-item" data-section="candidates">
                    <span class="nav-icon">👥</span>
                    <span class="nav-text">Candidates</span>
                    <div class="nav-indicator"></div>
                </div>
                <div onclick="window.location.href='../doomDashboard/Sections/chat/chat.html'" class="nav-item" data-section="inbox">
                    <span class="nav-icon">📧</span>
                    <span class="nav-text">Inbox</span>
                    <span class="nav-badge">12</span>
                    <div class="nav-indicator"></div>
                </div>
                <div onclick="window.location.href='../doomDashboard/Sections/job/admin-jobs.html'" class="nav-item" data-section="inbox">
                    <span class="nav-icon">📧</span>
                    <span class="nav-text">Job Posting</span>
                    <span class="nav-badge">12</span>
                    <div class="nav-indicator"></div>
                </div>
                <div onclick="window.location.href='../doomDashboard/Sections/interview/accepted-candidates.html'" class="nav-item" data-section="interviews">
                    <span class="nav-icon">🎯</span>
                    <span class="nav-text">Interviews</span>
                    <div class="nav-indicator"></div>
                </div>
                <div class="nav-item" data-section="applications">
                    <span class="nav-icon">🗓️</span>
                    <span class="nav-text">Calendar</span>
                    <div class="nav-indicator"></div>
                </div>
            </nav>
        </div>

        <!-- Main Content Area -->
        <div class="main-content">
            <!-- Enhanced Header -->
            <header class="header">
                <div class="header-side"></div>
                <div class="header-center">
                  <h2 class="page-title">Dashboard Overview</h2>
                </div>
                <div class="header-side"></div>
              </header>              

            <!-- Stats Grid with Enhanced Cards -->
            <div class="stats-section">
                <div class="stats-grid">
                    <div class="stat-card primary">
                        <div class="stat-icon">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                                <circle cx="9" cy="7" r="4"></circle>
                                <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
                                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                            </svg>
                        </div>
                        <div class="stat-content">
                            <div id="totalCandidates">0</div>
                            <div class="stat-label">Total Candidates</div>
                            <!-- <div class="stat-change positive">
                                <span class="change-icon">↗</span>
                                <span>12.5% from last week</span>
                            </div> -->
                        </div>
                        <div class="stat-chart">
                            <div class="mini-chart" data-values="20,25,30,28,35,40,38"></div>
                        </div>
                    </div>

                    <div class="stat-card success">
                        <div class="stat-icon">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                                <line x1="8" y1="21" x2="16" y2="21"></line>
                                <line x1="12" y1="17" x2="12" y2="21"></line>
                            </svg>
                        </div>
                        <div class="stat-content">
                            <div id="totalApplications">0</div>
                            <div class="stat-label">Active Applications</div>
                            <!-- <div class="stat-change positive">
                                <span class="change-icon">↗</span>
                                <span>3.2% from yesterday</span>
                            </div> -->
                        </div>
                        <div class="stat-chart">
                            <div class="mini-chart" data-values="15,18,22,19,25,28,26"></div>
                        </div>
                    </div>

                    <!-- <div class="stat-card warning">
                        <div class="stat-icon">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="12" y1="1" x2="12" y2="23"></line>
                                <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                            </svg>
                        </div>
                        <div class="stat-content">
                            <div class="stat-value">$156K</div>
                            <div class="stat-label">Salary Budget</div>
                            <div class="stat-change negative">
                                <span class="change-icon">↘</span>
                                <span>2.1% from last month</span>
                            </div>
                        </div>
                        <div class="stat-chart">
                            <div class="mini-chart" data-values="35,32,28,30,25,22,24"></div>
                        </div>
                    </div> -->

                    <div class="stat-card info">
                        <div class="stat-icon">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                                <line x1="16" y1="2" x2="16" y2="6"></line>
                                <line x1="8" y1="2" x2="8" y2="6"></line>
                                <line x1="3" y1="10" x2="21" y2="10"></line>
                            </svg>
                        </div>
                        <div class="stat-content">
                            <div id="pendingInterviews">0</div>
                            <div class="stat-label">Pending Interviews</div>
                            <!-- <div class="stat-change positive">
                                <span class="change-icon">↗</span>
                                <span>8.7% from yesterday</span>
                            </div> -->
                        </div>
                        <div class="stat-chart">
                            <div class="mini-chart" data-values="10,12,15,18,20,23,21"></div>
                        </div>
                    </div>
                </div>
            </div>
    <script type="module" src="doom_dashboard.js"></script>
</body>
</html>
