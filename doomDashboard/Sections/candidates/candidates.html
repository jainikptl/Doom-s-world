<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidates Management - Doom Dashboard</title>
    <link rel="stylesheet" href="candidates.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
    const isLoggedIn = localStorage.getItem("userLoggedIn");
    if (isLoggedIn!="doom") {
        window.location.href = "../../../Login/login.html";
    }
    </script>
</head>
<body>
    <div class="animated-bg">
        <div class="floating-shapes">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
            <div class="shape shape-3"></div>
            <div class="shape shape-4"></div>
            <div class="shape shape-5"></div>
        </div>
    </div>

    <div class="admin-container">
        <!-- Header -->
        <header class="admin-header">
            <div class="header-content">
                <div class="logo-section">
                    <div class="logo-icon">
                        <i class="fas fa-skull"></i>
                    </div>
                    <div class="logo-text">
                        <h1>Candidates Management</h1>
                        <p>Doom Dashboard</p>
                    </div>
                </div>
                <div class="header-actions">
                    <button class="header-btn" onclick="openAddCandidateModal()">
                        <i class="fas fa-user-plus"></i>
                        Add New Candidate
                    </button>
                    <a href="../../doom_dashboard.html" class="header-btn">
                        <i class="fas fa-arrow-left"></i>
                        Back to Dashboard
                    </a>
                    <button class="header-btn primary" onclick="logout()">
                        <i class="fas fa-sign-out-alt"></i>
                        Logout
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="admin-main">
            <!-- Stats Section -->
            <section class="stats-section">
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon">
                            <i class="fas fa-users"></i>
                        </div>
                        <div class="stat-info">
                            <h3 id="totalCandidates">0</h3>
                            <p>Total Candidates</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">
                            <i class="fas fa-user-check"></i>
                        </div>
                        <div class="stat-info">
                            <h3 id="activeCandidates">0</h3>
                            <p>Active Candidates</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">
                            <i class="fas fa-star"></i>
                        </div>
                        <div class="stat-info">
                            <h3 id="averageScore">0</h3>
                            <p>Average Ability Score</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">
                            <i class="fas fa-calendar-plus"></i>
                        </div>
                        <div class="stat-info">
                            <h3 id="newThisMonth">0</h3>
                            <p>New This Month</p>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Candidates Section -->
            <section class="candidates-section">
                <div class="section-header">
                    <h2>All Candidates</h2>
                    <div class="section-actions">
                        <div class="search-container">
                            <i class="fas fa-search"></i>
                            <input type="text" id="searchInput" placeholder="Search candidates..." onkeyup="filterCandidates()">
                        </div>
                        <select id="filterStatus" onchange="filterCandidates()">
                            <option value="all">All Status</option>
                            <option value="idle">Idle</option>
                            <option value="active">Active</option>
                            <option value="inactive">Inactive</option>
                            <option value="busy">Busy</option>
                        </select>
                        <select id="sortBy" onchange="sortCandidates()">
                            <option value="name">Sort by Name</option>
                            <option value="email">Sort by Email</option>
                            <option value="score">Sort by Score</option>
                            <option value="date">Sort by Join Date</option>
                        </select>
                    </div>
                </div>

                <!-- Loading State -->
                <div id="loadingState" class="loading-jobs">
                    <div class="loading-spinner">
                        <i class="fas fa-spinner fa-spin"></i>
                    </div>
                    <p>Loading candidates...</p>
                </div>

                <!-- Candidates List -->
                <div id="candidatesList" class="candidates-grid" style="display: none;">
                    <!-- Candidates will be populated here -->
                </div>

                <!-- Empty State -->
                <div id="emptyState" class="loading-jobs" style="display: none;">
                    <div class="loading-spinner">
                        <i class="fas fa-users"></i>
                    </div>
                    <p>No candidates found.</p>
                </div>
            </section>
        </main>
    </div>

    <!-- Add Candidate Modal -->
    <div id="addCandidateModal" class="modal-overlay">
        <div class="modal-content large">
            <div class="modal-header">
                <h3>Add New Candidate</h3>
                <button class="modal-close" onclick="closeAddCandidateModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <form id="addCandidateForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="candidateName">Full Name *</label>
                            <input type="text" id="candidateName" required placeholder="Enter candidate's full name">
                        </div>
                        <div class="form-group">
                            <label for="candidateEmail">Email Address *</label>
                            <input type="email" id="candidateEmail" required placeholder="Enter candidate's email">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="candidatePhone">Phone Number</label>
                            <input type="tel" id="candidatePhone" placeholder="Enter phone number">
                        </div>
                        <div class="form-group">
                            <label for="candidateStatus">Status</label>
                            <select id="candidateStatus">
                                <option value="idle">Idle</option>
                                <option value="active">Active</option>
                                <option value="inactive">Inactive</option>
                                <option value="busy">Busy</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="candidatePassword">Password *</label>
                            <input type="password" id="candidatePassword" required placeholder="Enter password (min 6 characters)">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="candidateBio">Bio/Description</label>
                        <textarea id="candidateBio" placeholder="Brief description about the candidate..."></textarea>
                    </div>

                    <div class="ability-scores-section">
                        <h4>Ability Scores</h4>
                        <div class="ability-scores-grid">
                            <div class="ability-score-item">
                                <label for="combatScore">Combat</label>
                                <input type="number" id="combatScore" min="0" max="100" value="0">
                                <div class="score-slider">
                                    <input type="range" min="0" max="100" value="0" onchange="updateScoreInput('combatScore', this.value)">
                                </div>
                            </div>
                            <div class="ability-score-item">
                                <label for="defenceScore">Defence</label>
                                <input type="number" id="defenceScore" min="0" max="100" value="0">
                                <div class="score-slider">
                                    <input type="range" min="0" max="100" value="0" onchange="updateScoreInput('defenceScore', this.value)">
                                </div>
                            </div>
                            <div class="ability-score-item">
                                <label for="intelligenceScore">Intelligence</label>
                                <input type="number" id="intelligenceScore" min="0" max="100" value="0">
                                <div class="score-slider">
                                    <input type="range" min="0" max="100" value="0" onchange="updateScoreInput('intelligenceScore', this.value)">
                                </div>
                            </div>
                            <div class="ability-score-item">
                                <label for="leadershipScore">Leadership</label>
                                <input type="number" id="leadershipScore" min="0" max="100" value="0">
                                <div class="score-slider">
                                    <input type="range" min="0" max="100" value="0" onchange="updateScoreInput('leadershipScore', this.value)">
                                </div>
                            </div>
                            <div class="ability-score-item">
                                <label for="stealthScore">Stealth</label>
                                <input type="number" id="stealthScore" min="0" max="100" value="0">
                                <div class="score-slider">
                                    <input type="range" min="0" max="100" value="0" onchange="updateScoreInput('stealthScore', this.value)">
                                </div>
                            </div>
                            <div class="ability-score-item">
                                <label for="techScore">Tech</label>
                                <input type="number" id="techScore" min="0" max="100" value="0">
                                <div class="score-slider">
                                    <input type="range" min="0" max="100" value="0" onchange="updateScoreInput('techScore', this.value)">
                                </div>
                            </div>
                        </div>
                        <div class="total-score">
                            <strong>Total Score: <span id="totalScore">0</span></strong>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn secondary" onclick="closeAddCandidateModal()">Cancel</button>
                        <button type="submit" class="btn primary">
                            <i class="fas fa-user-plus"></i>
                            Add Candidate
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- View Candidate Modal -->
    <div id="viewCandidateModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Candidate Details</h3>
                <button class="modal-close" onclick="closeViewCandidateModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div id="candidateDetailsContent">
                    <!-- Candidate details will be populated here -->
                </div>
                <div class="form-actions">
                    <button class="btn secondary" onclick="closeViewCandidateModal()">Close</button>
                    <button class="btn primary" id="editCandidateBtn">
                        <i class="fas fa-edit"></i>
                        Edit Candidate
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toastMessage"></span>
    </div>

    <!-- Firebase SDK v9+ -->
    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="candidates.js"></script>
</body>
</html>
