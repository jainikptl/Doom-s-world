<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enhanced Swipe Section</title>
  <link rel="stylesheet" href="selection.css">
</head>
<body>
  <!-- Enhanced Swipe Section -->
<div class="swipe-section">
    <div class="section-header">
        <div class="section-title">
            <h3>Candidate Selection</h3>
            <p>Swipe through candidates to make quick decisions</p>
        </div>
        <div class="section-actions">
            <span class="candidates-remaining">Remaining: <span id="candidateCount">5</span></span>
            <button class="refresh-btn" onclick="resetCandidates()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="23 4 23 10 17 10"></polyline>
                    <polyline points="1 20 1 14 7 14"></polyline>
                    <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path>
                </svg>
            </button>
        </div>
    </div>

    <div class="swipe-container" id="swipeContainer">
        <!-- Candidate cards will be populated by JavaScript -->
    </div>

    <div class="swipe-actions">
        <button class="action-btn reject-btn" onclick="rejectCandidate()" title="Reject">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </button>
        <button class="action-btn like-btn" onclick="likeCandidate()" title="Like">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"></svg>
        </button>
        <button class="action-btn accept-btn" onclick="acceptCandidate()" title="Accept">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="20,6 9,17 4,12"></polyline>
            </svg>
        </button>
    </div>
</div>
<script type="module" src="selection.js"></script>
</body>
</html>
