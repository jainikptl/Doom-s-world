<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Board - Avenger Recruitment</title>
    <link rel="stylesheet" href="candidate-jobs.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script>
    const isLoggedIn = localStorage.getItem("userLoggedIn");
    if (isLoggedIn!="candidate") {
        window.location.href = "../../../Login/login.html";
    }
    </script>
</head>
<body>
    <!-- Animated Background -->
    <div class="animated-bg">
        <div class="floating-shapes">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
            <div class="shape shape-3"></div>
            <div class="shape shape-4"></div>
            <div class="shape shape-5"></div>
        </div>
    </div>

    <!-- Loading Screen -->
    <div class="loading-screen" id="loadingScreen">
        <div class="loading-container">
            <div class="loading-spinner">
                <i class="fas fa-spinner fa-spin"></i>
            </div>
            <p>Loading Mission Board...</p>
        </div>
    </div>

    <!-- Main Job Board -->
    <div class="job-board" id="jobBoard" style="display: none;">
        <!-- Header -->
        <header class="candidate-header">
            <div class="header-content">
                <div class="logo-section">
                    <div class="logo-icon">
                        <i class="fas fa-mask"></i>
                    </div>
                    <div class="logo-text">
                        <h1>Mission Board</h1>
                        <p>Available Assignments</p>
                    </div>
                </div>
                
                <div class="candidate-profile" id="candidateProfile">
                    <div class="profile-stats">
                        <div class="stat-item">
                            <i class="fas fa-fist-raised"></i>
                            <span id="combatPoints">0</span>
                        </div>
                        <div class="stat-item">
                            <i class="fas fa-shield-alt"></i>
                            <span id="defensePoints">0</span>
                        </div>
                        <div class="stat-item">
                            <i class="fas fa-cog"></i>
                            <span id="techPoints">0</span>
                        </div>
                    </div>
                    
                    <div class="profile-info">
                        <div class="profile-avatar" id="profileAvatar">
                            <span id="profileInitials"></span>
                        </div>
                        <div class="profile-details">
                            <h3 id="profileName"></h3>
                            <p>Avenger Candidate</p>
                        </div>
                    </div>
                    
                    <button class="header-btn" id="logoutBtn">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- Filters -->
        <section class="filters-section">
            <div class="filters-container">
                <div class="search-container">
                    <i class="fas fa-search"></i>
                    <input type="text" id="jobSearchInput" placeholder="Search missions...">
                </div>
                
                <div class="filter-group">
                    <select id="categoryFilter">
                        <option value="all">All Categories</option>
                        <option value="combat">Combat Operations</option>
                        <option value="technical">Technical Support</option>
                        <option value="intelligence">Intelligence</option>
                        <option value="leadership">Leadership</option>
                        <option value="stealth">Stealth Operations</option>
                        <option value="defense">Defense Systems</option>
                    </select>
                    
                    <select id="priorityFilter">
                        <option value="all">All Priorities</option>
                        <option value="critical">Critical</option>
                        <option value="high">High</option>
                        <option value="medium">Medium</option>
                        <option value="low">Low</option>
                    </select>
                </div>
            </div>
        </section>

        <!-- Job Listings -->
        <main class="jobs-main">
            <div class="jobs-container" id="jobsContainer">
                <!-- Jobs will be loaded here -->
                <div class="loading-jobs">
                    <div class="loading-spinner">
                        <i class="fas fa-spinner fa-spin"></i>
                    </div>
                    <p>Loading available missions...</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Job Application Modal -->
    <div class="modal-overlay" id="applicationModal">
        <div class="modal-content large">
            <div class="modal-header">
                <h3>Mission Application</h3>
                <button class="modal-close" id="applicationClose">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <div class="modal-body">
                <div class="application-job-info" id="applicationJobInfo">
                    <!-- Job info will be loaded here -->
                </div>
                
                <form id="applicationForm">
                    <div class="form-section">
                        <h4>Your Current Stats</h4>
                        <div class="current-stats" id="currentStats">
                            <!-- Stats will be loaded here -->
                        </div>
                    </div>
                    
                    <div class="form-section">
                        <h4>Requirements Check</h4>
                        <div class="requirements-check" id="requirementsCheck">
                            <!-- Requirements will be checked here -->
                        </div>
                    </div>
                    
                    <div class="form-section">
                        <h4>Resume Submission</h4>
                        <p class="section-description">Submit your resume in text format or upload a PDF file</p>
                        
                        <div class="resume-options">
                            <div class="resume-option">
                                <input type="radio" id="resumeText" name="resumeType" value="text" checked>
                                <label for="resumeText">
                                    <i class="fas fa-edit"></i>
                                    <span>Text Resume</span>
                                </label>
                            </div>
                            
                            <div class="resume-option">
                                <input type="radio" id="resumeFile" name="resumeType" value="file">
                                <label for="resumeFile">
                                    <i class="fas fa-file-pdf"></i>
                                    <span>Upload PDF</span>
                                </label>
                            </div>
                        </div>
                        
                        <div class="resume-input" id="resumeTextInput">
                            <textarea id="resumeTextArea" rows="8" placeholder="Enter your resume details, experience, skills, and qualifications..."></textarea>
                        </div>
                        
                        <div class="resume-input" id="resumeFileInput" style="display: none;">
                            <div class="file-upload">
                                <input type="file" id="resumeFileUpload" accept=".pdf" hidden>
                                <label for="resumeFileUpload" class="file-upload-label">
                                    <i class="fas fa-cloud-upload-alt"></i>
                                    <span>Click to upload PDF resume</span>
                                </label>
                                <div class="file-info" id="fileInfo" style="display: none;">
                                    <i class="fas fa-file-pdf"></i>
                                    <span id="fileName"></span>
                                    <button type="button" id="removeFile">
                                        <i class="fas fa-times"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-actions">
                        <button type="button" class="btn secondary" id="cancelApplicationBtn">Cancel</button>
                        <button type="submit" class="btn primary" id="submitApplicationBtn">
                            <i class="fas fa-paper-plane"></i>
                            <span>Submit Application</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-storage-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    
    <script type="module" src="candidate-jobs.js"></script>
</body>
</html>
